name: greenhouse-iot
services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    stdin_open: true
    tty: true
    networks:
      - greenhouse-network
  grafana:
    image: grafana/grafana:13.0.1
    container_name: grafana
    restart: unless-stopped
    depends_on: 
      - influxdb
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-storage:/var/lib/grafana
    networks:
      - greenhouse-network
  influxdb:
    container_name: influxdb
    image: influxdb:3-core
    restart: unless-stopped
    ports:
      - 8181:8181
    command:
      - influxdb3
      - serve
      - --node-id=node0
      - --object-store=file
      - --data-dir=/var/lib/influxdb3/data
      - --plugin-dir=/var/lib/influxdb3/plugins
    volumes:
      - ./influxdb/core/data:/var/lib/influxdb3/data
      - ./influxdb/core/plugins:/var/lib/influxdb3/plugins
    networks:
      - greenhouse-network
  telegraf:
    image: telegraf:1.38.2
    container_name: telegraf
    restart: unless-stopped
    depends_on:
      - mosquitto
      - influxdb
    volumes:
      - ./telegraf/telegraf.conf:/etc/telegraf/telegraf.conf
    networks:
      - greenhouse-network
  control-panel:
    build:
      context: ./control_panel
      dockerfile: Dockerfile
    container_name: control-panel
    restart: unless-stopped
    ports:
      - "8080:80"
    networks:
      - greenhouse-network
volumes:
  grafana-storage:
networks:
  greenhouse-network:
    driver: bridge